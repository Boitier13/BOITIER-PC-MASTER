[package]
name = "boitier-pc-master"
version = "0.1.0"
description = "BOITIER PC MASTER — exploration et inventaire de fichiers, désinstallation avancée"
authors = ["Boitier13"]
edition = "2021"
rust-version = "1.77"
default-run = "boitier-pc-master"

[lib]
# Nom de bibliothèque utilisé par `main.rs` : boitier_lib::run()
name = "boitier_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Énumération des volumes (aucune dépendance réseau, aucun privilège).
sysinfo = "0.30"

[dev-dependencies]
# Arborescences temporaires pour les tests du moteur d'exploration.
tempfile = "3"

# Lecture du registre Windows pour l'inventaire des applications : API en
# lecture seule, aucune écriture, aucun privilège particulier.
[target.'cfg(windows)'.dependencies]
winreg = "0.52"

# Aucun plugin d'accès (fs, shell, process, http). SQLite (rusqlite, feature
# "bundled") sera ajouté avec la première migration réellement exécutée.

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
